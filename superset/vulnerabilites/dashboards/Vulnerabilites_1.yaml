  MD-METHODO:
    type: MARKDOWN
    id: MD-METHODO
    children: []
    meta:
      width: 12
      height: 8
      code: '#### Encadre methodologique


        **HHI** : concentration des fournisseurs (Herfindahl-Hirschman, 0-1, 1 = un
        seul fournisseur). **CDI2/CDI3** : dependance extra-UE (variantes). **EXPORT_HHI**,
        **CENTRALITY_RISK**, **CLUSTERING_W**, **SPOF** : metriques de reseau (structure
        des echanges mondiaux du produit). Score et rang synthetiques : consensus
        multi-methodes (`consensus_borda` par defaut). **Convention : rang 1 = unite
        la plus vulnerable.**'
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-MAIN
    - TAB-PAYS

    children: []
    meta:
      width: 12
      height: 30
      code: |-
        **Ce que montre la page.** Pour le pays, l'année et le flux choisis (import ou export) :
        - le **tableau** classe les produits du plus vulnérable (rang 1) au moins vulnérable, au sein du niveau de nomenclature choisi (SH6 par défaut ; SH2 et SH4 n'ont pas de rang) ;
        - le **diagramme des partenaires** montre de qui le pays dépend pour un produit : ses fournisseurs à l'import, ses clients à l'export, du plus important au moins important, puis « Autres pays » pour le reste. Couleur : pays de l'UE ou hors UE ;
        - les **courbes** suivent dans le temps les échanges et un indicateur des produits choisis (au départ, les 5 premiers du tableau).

        **Comment lire.** Pour chaque indicateur, plus la valeur est élevée, plus le produit est vulnérable ; une cellule rouge signale un seuil d'alerte dépassé. La **fourchette du rang** montre si les différentes façons de combiner les indicateurs s'accordent : étroite, le classement est robuste ; large, il dépend de la pondération retenue.

        **Comment s'en servir.** Choisissez un pays ; repérez les produits en tête et en rouge ; regardez de qui le pays dépend pour l'un d'eux (par défaut le premier du tableau, sinon le filtre « Produit à détailler ») ; suivez son évolution dans les courbes (filtre « Produits des courbes » ; vide, les 5 premiers produits).

        Définitions des indicateurs et méthode : documentation du projet, page « Tableaux de bord ». Sources : Eurostat Comext (DS-045409), CEPII BACI (réseau mondial).

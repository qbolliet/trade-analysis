    children: []
    meta:
      width: 12
      height: 30
      code: |-
        **Ce que montre la page.** Pour le produit, l'année et le flux choisis (import ou export) :
        - le **tableau** classe les pays de l'UE du plus vulnérable (rang 1) au moins vulnérable ;
        - le **diagramme de flux** montre d'où viennent les importations de chaque pays de l'UE (à l'export : où vont ses exportations). Les principaux pays hors UE sont détaillés ; les échanges entre pays de l'UE sont regroupés en un seul bloc, pour faire ressortir la dépendance hors UE. L'épaisseur d'un flux est proportionnelle aux échanges ;
        - les **courbes** suivent dans le temps les échanges et un indicateur des pays choisis (au départ, les 5 premiers du tableau).

        **Comment lire.** Pour chaque indicateur, plus la valeur est élevée, plus le pays est vulnérable ; une cellule rouge signale un seuil d'alerte dépassé. La **fourchette du rang** montre si les différentes façons de combiner les indicateurs s'accordent : étroite, le classement est robuste ; large, il dépend de la pondération retenue.

        **Comment s'en servir.** Choisissez un produit ; repérez les pays en tête et en rouge ; identifiez dans le diagramme les fournisseurs hors UE dont ils dépendent ; comparez l'évolution des pays dans les courbes (filtre « Pays des courbes » ; vide, les 5 premiers pays).

        Définitions des indicateurs et méthode : documentation du projet, page « Tableaux de bord ». Sources : Eurostat Comext (DS-045409), CEPII BACI (réseau mondial).

table_name: trade_series_by_reporter
main_dttm_col: period
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: serving.dashboard
sql: "-- Séries temporelles des produits les plus vulnérables (trade) : les top_n\n\
  -- unités de meilleur rang consensus l'année choisie, plus celles du filtre d'ajout.\n\
  -- Filtres lus par filter_values(remove_filter=True) et appliqués dans la requête.\n\
  {% set years = filter_values('year', remove_filter=True) %}\n{% set flows = filter_values('flow_label',\
  \ remove_filter=True) %}\n{% set focus = filter_values('reporter_display', remove_filter=True)\
  \ %}\n{% set extra = filter_values('product_display', remove_filter=True) %}\n{%\
  \ set in_force = filter_values('in_force', remove_filter=True) %}\n{% set chosen\
  \ = filter_values('measure', remove_filter=True) %}\nWITH ctx AS (\n  SELECT * FROM\
  \ serving.dashboard.cell_scores\n  WHERE flow_label IN {{ (flows or ['Import'])|where_in\
  \ }}\n    AND reporter_display IN {{ (focus or [\"FR — France (incl. Saint Barthélemy\
  \ 'BL' -> 2012; incl. French Guiana 'GF', Guadeloupe 'GP', Martinique 'MQ', Réunion\
  \ 'RE' from 1997; incl. Mayotte 'YT' from 2014)\"])|where_in }}\n    AND in_force\
  \ = {{ 'false' if in_force and not in_force[0] else 'true' }}\n),\nrank_year AS\
  \ (\n  {% if years %}SELECT {{ years[0]|int }} AS year\n  {% else %}SELECT max(year)\
  \ AS year FROM ctx WHERE primary_rank_by_reporter IS NOT NULL{% endif %}\n),\ntop\
  \ AS (\n  SELECT product FROM ctx\n  WHERE year = (SELECT year FROM rank_year) AND\
  \ primary_rank_by_reporter IS NOT NULL\n  ORDER BY primary_rank_by_reporter, product\n\
  \  LIMIT {{ top_n|default(5)|int }}\n),\nunits AS (\n  SELECT product FROM top\n\
  \  {% if extra %}UNION SELECT product FROM ctx WHERE product_display IN {{ extra|where_in\
  \ }}{% endif %}\n),\nseries AS (\n  SELECT c.year, make_date(c.year, 1, 1) AS period,\
  \ c.flow_label, c.in_force,\n         c.reporter_display, c.product_display,\n \
  \        CASE WHEN length(c.product_display) > 48 THEN left(c.product_display, 47)\
  \ || '…'\n              ELSE c.product_display END AS unit,\n         c.trade_value_eur\
  \ AS \"Valeur (€)\", c.trade_quantity_100kg AS \"Quantité (100 kg)\"\n  FROM ctx\
  \ AS c\n  WHERE c.product IN (SELECT product FROM units)\n)\nSELECT * FROM (UNPIVOT\
  \ series ON \"Valeur (€)\", \"Quantité (100 kg)\" INTO NAME measure VALUE value)\n\
  WHERE measure IN {{ (chosen or [\"Valeur (€)\"])|where_in }}\n"
params: null
template_params:
  top_n: 5

table_name: partners_by_reporter
main_dttm_col: null
description: Principaux partenaires du pays choisi pour un produit (fournisseurs à l'import, clients à
  l'export), plus une ligne « Autres pays » qui complète jusqu'aux échanges totaux.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: serving.dashboard
sql: |
  -- Partenaires du pays choisi pour UN produit : les n_partners premiers partenaires
  -- (rangs de la table flows, en valeur), puis une ligne « Autres pays » égale aux échanges
  -- totaux de cell_scores moins la somme des barres, pour que la somme des barres reste égale
  -- au total. Produit détaillé, par ordre de priorité : clic sur un code produit du tableau
  -- (filtrage croisé sur la colonne product), filtre « Produit à détailler » (colonne
  -- detail_product), sinon produit de rang 1 du pays au sein du niveau de nomenclature choisi.
  -- Pays de l'UE : déclarant individuel de flows la même année (Comext ne publie que les
  -- États membres ; les agrégats déclarants, dont EU27_2020, contiennent un « _ »).
  -- Libellés « rang. pays — part » : le tri du graphique porte sur ce libellé, d'où le rang en
  -- préfixe (complété d'une espace sous 10 pour un ordre correct) et « Autres pays » en dernier.
  {% set years = filter_values('year', remove_filter=True) %}
  {% set flows = filter_values('flow_label', remove_filter=True) %}
  {% set focus = filter_values('reporter_display', remove_filter=True) %}
  {% set levels = filter_values('product_level_label', remove_filter=True) %}
  {% set in_force = filter_values('in_force', remove_filter=True) %}
  {% set detail = filter_values('detail_product', remove_filter=True) %}
  {% set clicked = filter_values('product', remove_filter=True) %}
  {% set chosen = filter_values('measure', remove_filter=True) %}
  {% set columns = {"Valeur (€)": ["value_eur", "trade_value_eur"], "Quantité (100 kg)": ["quantity_100kg", "trade_quantity_100kg"]} %}
  {% set choice = chosen[0] if chosen and chosen[0] in columns else "Valeur (€)" %}
  WITH ctx AS (
    -- Lignes en vigueur seulement : flows ne porte que les codes de la nomenclature en vigueur
    SELECT * FROM serving.dashboard.cell_scores
    WHERE flow_label IN {{ (flows or ['Import'])|where_in }}
      AND reporter_display IN {{ (focus or ["FR — France (incl. Saint Barthélemy 'BL' -> 2012; incl. French Guiana 'GF', Guadeloupe 'GP', Martinique 'MQ', Réunion 'RE' from 1997; incl. Mayotte 'YT' from 2014)"])|where_in }}
      AND in_force
      {% if years %}AND year = {{ years[0]|int }}
      {% else %}AND year = (SELECT max(year) FROM serving.dashboard.cell_scores WHERE primary_rank_by_reporter_level IS NOT NULL){% endif %}
  ),
  cell AS (
    SELECT * FROM ctx
    {% if clicked %}WHERE product IN {{ clicked|where_in }}
    {% elif detail %}WHERE product_display IN {{ detail|where_in }}
    {% else %}WHERE primary_rank_by_reporter_level IS NOT NULL
      {% if levels %}AND product_level_label IN {{ levels|where_in }}{% endif %}
    ORDER BY primary_rank_by_reporter_level, product{% endif %}
    LIMIT 1
  ),
  f AS (
    SELECT fl.partner, fl.partner_label, fl.is_aggregate, fl.rank, fl.share,
           CAST(fl.{{ columns[choice][0] }} AS DOUBLE) AS value
    FROM serving.dashboard.flows AS fl
    JOIN cell AS c
      ON fl.reporter = c.reporter AND fl.product = c.product AND fl.flow = c.flow
    WHERE fl.year = (SELECT year FROM cell)
  ),
  members AS (
    SELECT DISTINCT reporter FROM serving.dashboard.flows
    WHERE year = (SELECT year FROM cell) AND NOT contains(reporter, '_')
  ),
  bars AS (
    SELECT f.partner, coalesce(nullif(trim(split_part(f.partner_label, ' (', 1)), ''), f.partner) AS name,
           f.value, f.share, f.partner IN (SELECT reporter FROM members) AS is_eu,
           row_number() OVER (ORDER BY f.value DESC, f.partner) AS position
    FROM f
    WHERE NOT f.is_aggregate AND f.rank <= {{ n_partners|default(10)|int }} AND f.value IS NOT NULL
  ),
  other AS (
    -- Reste du total ; omis s'il est nul, négatif ou inconnu (quantité non déclarée)
    SELECT 'Autres pays' AS name,
           (SELECT CAST({{ columns[choice][1] }} AS DOUBLE) FROM cell) - coalesce(sum(value), 0) AS value,
           1 - coalesce((SELECT sum(share) FROM f WHERE NOT is_aggregate AND rank <= {{ n_partners|default(10)|int }}), 0) AS share
    FROM bars
  ),
  lines AS (
    SELECT lpad(CAST(position AS VARCHAR), 2, ' ') || '. ' || name AS label, name, value, share,
           CASE WHEN is_eu THEN 'Pays de l''UE' ELSE 'Pays hors UE' END AS zone, position
    FROM bars
    UNION ALL
    SELECT name, name, value, share, 'Autres pays', 99 FROM other WHERE value > 0
  )
  SELECT (SELECT year FROM cell) AS year,
         (SELECT flow_label FROM cell) AS flow_label,
         (SELECT reporter_display FROM cell) AS reporter_display,
         (SELECT product_display FROM cell) AS product_display,
         {{ [choice]|where_in }} AS measure,
         l.label || CASE WHEN l.share IS NULL THEN ''
                         ELSE ' — ' || replace(format('{:.1f}', 100 * l.share), '.', ',') || ' %' END AS bar_label,
         l.name AS partner_name, l.zone, l.position, l.share, l.value,
         CASE WHEN l.zone = 'Pays de l''UE' THEN l.value END AS value_eu,
         CASE WHEN l.zone = 'Pays hors UE' THEN l.value END AS value_extra,
         CASE WHEN l.zone = 'Autres pays' THEN l.value END AS value_other
  FROM lines AS l

sql: 'SELECT reporter, flow, year, product_label, primary_rank_by_reporter, in_force,
  classification,

  ''HHI'' AS metric_name, "HHI_norm" AS value FROM serving.demo_dashboard.cell_scores

  UNION ALL SELECT reporter, flow, year, product_label, primary_rank_by_reporter,
  in_force, classification, ''CDI2'', "CDI2_norm" FROM serving.demo_dashboard.cell_scores

  UNION ALL SELECT reporter, flow, year, product_label, primary_rank_by_reporter,
  in_force, classification, ''CDI3'', "CDI3_norm" FROM serving.demo_dashboard.cell_scores

  UNION ALL SELECT reporter, flow, year, product_label, primary_rank_by_reporter,
  in_force, classification, ''EXPORT_HHI'', "EXPORT_HHI_norm" FROM serving.demo_dashboard.cell_scores

  UNION ALL SELECT reporter, flow, year, product_label, primary_rank_by_reporter,
  in_force, classification, ''CENTRALITY_RISK'', "CENTRALITY_RISK_norm" FROM serving.demo_dashboard.cell_scores

  UNION ALL SELECT reporter, flow, year, product_label, primary_rank_by_reporter,
  in_force, classification, ''CLUSTERING_W'', "CLUSTERING_W_norm" FROM serving.demo_dashboard.cell_scores

  UNION ALL SELECT reporter, flow, year, product_label, primary_rank_by_reporter,
  in_force, classification, ''SPOF'', "SPOF_norm" FROM serving.demo_dashboard.cell_scores'

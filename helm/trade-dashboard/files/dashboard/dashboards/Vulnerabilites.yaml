    - TABS-MAIN
    - TAB-PAYS
    children:
    - MARKDOWN-PAYS
    meta:
      background: BACKGROUND_TRANSPARENT
  MARKDOWN-PAYS:
    type: MARKDOWN
    id: MARKDOWN-PAYS
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-MAIN
    - TAB-PAYS
    - ROW-PAYS-HELP
    children: []
    meta:
      width: 12
      height: 22
      code: 'Classement des **produits** du pays choisi, pour l''année et le flux
        choisis.


        **Rang consensus** : 1 = le plus vulnérable (consensus de Borda des méthodes
        de synthèse). **Incertitude** : intervalle interquartile [q25–q75] des rangs
        donnés à la même ligne par les méthodes de synthèse (nombre de méthodes entre
        parenthèses) ; elle mesure le désaccord entre méthodes, pas une incertitude
        d''échantillonnage. **Niveau de nomenclature** : produits classés au sein
        du niveau choisi (SH6, NC8…), rangs et incertitude compris ; les codes SH2
        et SH4 n''ont pas de rang (pas de métriques réseau). Cellules rouges : métrique
        au-delà de son seuil d''alerte.


        **Courbes** : les 5 produits les mieux classés du niveau choisi l''année choisie,
        plus ceux du filtre « Ajouter » ; grandeur (valeur ou quantité) et métrique
        au choix dans les filtres. Sources : Eurostat Comext (DS-045409), CEPII BACI
        (réseau), synthèse multicritère du pipeline.'
  CHART-PAYS-table:
    type: CHART
    id: CHART-PAYS-table
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-MAIN
    - TAB-PAYS

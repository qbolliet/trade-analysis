table_name: partner_flows_by_product
main_dttm_col: null
description: Flux du produit choisi entre les pays de l'UE et leurs partenaires (un lien source → cible
  par ligne), pour le diagramme de Sankey de l'onglet Par produit.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: serving.dashboard
sql: |
  -- Liens du diagramme de Sankey d'un produit, côté UE : les États membres déclarants
  -- (agrégats déclarants exclus, dont EU27_2020 qui doublerait les flux). Côté partenaires :
  --   - les k_partners premiers partenaires hors UE, classés sur le cumul des déclarants ;
  --   - « Autres pays hors UE » : agrégat extra-UE du déclarant moins ses flux vers ces
  --     partenaires (borné à 0), qui absorbe aussi les partenaires coupés par la table flows ;
  --   - « Union européenne (échanges entre États membres) » : total WORLD moins agrégat
  --     extra-UE, la même décomposition que l'indicateur de part des échanges hors UE.
  -- Les échanges intra-UE forment un seul nœud : aucun pays n'apparaît des deux côtés, ce
  -- qui évite les cycles, que le diagramme refuse, et les nœuds homonymes. Un lien entrant
  -- dans un pays somme donc à son total WORLD. Import : partenaire → pays de l'UE ; export :
  -- pays de l'UE → partenaire. Pays de l'UE : déclarant individuel de flows la même année.
  {% set years = filter_values('year', remove_filter=True) %}
  {% set flows = filter_values('flow_label', remove_filter=True) %}
  {% set focus = filter_values('product_display', remove_filter=True) %}
  {% set in_force = filter_values('in_force', remove_filter=True) %}
  {% set chosen = filter_values('measure', remove_filter=True) %}
  {% set columns = {"Valeur (€)": "value_eur", "Quantité (100 kg)": "quantity_100kg"} %}
  {% set choice = chosen[0] if chosen and chosen[0] in columns else "Valeur (€)" %}
  WITH ctx AS (
    -- Cellules en vigueur du produit : codes du produit et du flux, déclarants classés
    SELECT DISTINCT year, product, flow, flow_label FROM serving.dashboard.cell_scores
    WHERE flow_label IN {{ (flows or ['Import'])|where_in }}
      AND product_display IN {{ (focus or ["850760 — Lithium-ion accumulators (excl. spent)"])|where_in }}
      AND in_force
      {% if years %}AND year = {{ years[0]|int }}
      {% else %}AND year = (SELECT max(year) FROM serving.dashboard.cell_scores WHERE primary_rank_by_product IS NOT NULL){% endif %}
    LIMIT 1
  ),
  f AS (
    SELECT fl.reporter, fl.reporter_label, fl.partner, fl.partner_label, fl.is_aggregate,
           CAST(fl.{{ columns[choice] }} AS DOUBLE) AS value
    FROM serving.dashboard.flows AS fl
    JOIN ctx AS c ON fl.product = c.product AND fl.flow = c.flow
    WHERE fl.year = (SELECT year FROM ctx) AND NOT contains(fl.reporter, '_')
  ),
  members AS (
    SELECT DISTINCT reporter FROM serving.dashboard.flows
    WHERE year = (SELECT year FROM ctx) AND NOT contains(reporter, '_')
  ),
  totals AS (
    -- Total et part hors UE par déclarant ; agrégat extra-UE absent : aucun flux hors UE
    SELECT reporter, any_value(reporter_label) AS reporter_label,
           max(value) FILTER (WHERE partner = 'WORLD') AS world,
           coalesce(max(value) FILTER (WHERE partner = 'EXT_EU'), 0) AS extra
    FROM f GROUP BY reporter
  ),
  extra_partners AS (
    SELECT * FROM f
    WHERE NOT is_aggregate AND value IS NOT NULL AND partner NOT IN (SELECT reporter FROM members)
  ),
  top_partners AS (
    SELECT partner FROM extra_partners GROUP BY partner
    ORDER BY sum(value) DESC, partner LIMIT {{ k_partners|default(12)|int }}
  ),
  links AS (
    SELECT p.reporter,
           coalesce(nullif(trim(split_part(p.partner_label, ' (', 1)), ''), p.partner) AS partner_node,
           p.value
    FROM extra_partners AS p WHERE p.partner IN (SELECT partner FROM top_partners)
    UNION ALL
    SELECT t.reporter, 'Autres pays hors UE',
           greatest(t.extra - coalesce((SELECT sum(p.value) FROM extra_partners AS p
                                        WHERE p.reporter = t.reporter
                                          AND p.partner IN (SELECT partner FROM top_partners)), 0), 0)
    FROM totals AS t
    UNION ALL
    SELECT t.reporter, 'Union européenne (échanges entre États membres)', greatest(t.world - t.extra, 0)
    FROM totals AS t
  ),
  named AS (
    SELECT coalesce(nullif(trim(split_part(t.reporter_label, ' (', 1)), ''), l.reporter) AS eu_node,
           l.partner_node, l.value
    FROM links AS l JOIN totals AS t USING (reporter)
    WHERE l.value > 0
  )
  SELECT (SELECT year FROM ctx) AS year,
         (SELECT flow_label FROM ctx) AS flow_label,
         {{ [choice]|where_in }} AS measure,
         {% if (flows or ['Import'])[0] == 'Export' %}eu_node AS source, partner_node AS target,
         {% else %}partner_node AS source, eu_node AS target,{% endif %}
         value
  FROM named
params: null

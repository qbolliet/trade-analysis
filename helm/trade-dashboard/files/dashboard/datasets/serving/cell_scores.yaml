columns:
- column_name: CDI3
  verbose_name: Hors UE / flux de sens inverse (CDI3)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: 'À l''import : importations hors UE rapportées aux exportations totales du pays (au-delà
    de 1, les achats hors UE dépassent ce que le pays exporte : faible capacité à les remplacer par sa
    production). À l''export : exportations hors UE rapportées aux importations totales. Alerte au-delà
    de 1. Plus la valeur est élevée, plus la ligne est vulnérable.'
  python_date_format: null
  extra: null
- column_name: rank_iqr_by_reporter_level
  verbose_name: Fourchette du rang
  is_dttm: false
  is_active: true
  type: STRING
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: CASE WHEN n_methods_by_reporter_level >= 2 THEN format('{:g}', round(rank_q25_by_reporter_level,
    1)) || ' – ' || format('{:g}', round(rank_q75_by_reporter_level, 1)) END
  description: 'Rangs donnés à la ligne par les différentes façons de combiner les indicateurs (moitié
    centrale de ces rangs). Étroite : le classement est robuste ; large : il dépend de la façon de pondérer.
    Vide si moins de deux façons ont classé la ligne.'
  python_date_format: null
  extra: null
- column_name: rank_iqr_by_product
  verbose_name: Fourchette du rang
  is_dttm: false
  is_active: true
  type: STRING
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: CASE WHEN n_methods_by_product >= 2 THEN format('{:g}', round(rank_q25_by_product, 1)) ||
    ' – ' || format('{:g}', round(rank_q75_by_product, 1)) END
  description: 'Rangs donnés à la ligne par les différentes façons de combiner les indicateurs (moitié
    centrale de ces rangs). Étroite : le classement est robuste ; large : il dépend de la façon de pondérer.
    Vide si moins de deux façons ont classé la ligne.'
  python_date_format: null
  extra: null
- column_name: rank_iqr_by_reporter
  verbose_name: Fourchette du rang
  is_dttm: false
  is_active: true
  type: STRING
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: CASE WHEN n_methods_by_reporter >= 2 THEN format('{:g}', round(rank_q25_by_reporter, 1))
    || ' – ' || format('{:g}', round(rank_q75_by_reporter, 1)) END
  description: 'Rangs donnés à la ligne par les différentes façons de combiner les indicateurs (moitié
    centrale de ces rangs). Étroite : le classement est robuste ; large : il dépend de la façon de pondérer.
    Vide si moins de deux façons ont classé la ligne.'
  python_date_format: null
  extra: null
- column_name: SPOF
  verbose_name: Point de défaillance unique (SPOF)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: 'Combinaison, entre 0 et 1, des rangs du produit en concentration mondiale et en poids
    des pays pivots : un produit élevé sur les deux dépend d''une offre (import) ou d''une demande (export)
    difficile à diversifier. Alerte au-delà de 0,9. Plus la valeur est élevée, plus la ligne est vulnérable.'
  python_date_format: null
  extra: null
- column_name: CLUSTERING_W
  verbose_name: Cloisonnement du réseau (CLUSTERING_W)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: 'Tendance des partenaires commerciaux à commercer aussi entre eux pour ce produit (coefficient
    de regroupement pondéré) : un marché organisé en blocs laisse peu de marge pour diversifier après
    un choc. Identique à l''import et à l''export. Alerte au-delà de 0,5. Plus la valeur est élevée, plus
    la ligne est vulnérable.'
  python_date_format: null
  extra: null
- column_name: CENTRALITY_RISK
  verbose_name: Poids des pays pivots (CENTRALITY_RISK)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: 'Présence, dans le réseau mondial du produit, de quelques fournisseurs (à l''import) ou
    acheteurs (à l''export) très centraux : dispersion de leur centralité pondérée. Au-delà de 2,5 (seuil
    d''alerte), le premier pays pèse environ deux tiers du commerce mondial. Plus la valeur est élevée,
    plus la ligne est vulnérable.'
  python_date_format: null
  extra: null
- column_name: n_alerts
  verbose_name: Seuils d'alerte dépassés (sur 7)
  is_dttm: false
  is_active: true
  type: INTEGER
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: coalesce(CAST("HHI_ALERT" AS INTEGER), 0) + coalesce(CAST("CDI2_ALERT" AS INTEGER), 0) +
    coalesce(CAST("CDI3_ALERT" AS INTEGER), 0) + coalesce(CAST("WORLD_HHI_ALERT" AS INTEGER), 0) + coalesce(CAST("CENTRALITY_RISK_ALERT"
    AS INTEGER), 0) + coalesce(CAST("CLUSTERING_W_ALERT" AS INTEGER), 0) + coalesce(CAST("SPOF_ALERT"
    AS INTEGER), 0)
  description: Nombre d'indicateurs au-delà de leur seuil d'alerte (0 à 7).
  python_date_format: null
  extra: null
- column_name: HHI
  verbose_name: Concentration des partenaires (HHI)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: 'Somme des carrés des parts des partenaires du pays dans ses échanges du produit : ses
    fournisseurs à l''import, ses clients à l''export. Vaut 1 avec un seul partenaire ; alerte au-delà
    de 0,5. Plus la valeur est élevée, plus la ligne est vulnérable.'
  python_date_format: null
  extra: null
- column_name: CDI2
  verbose_name: Part des échanges hors UE (CDI2)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: Échanges du pays avec les pays hors de l'Union, rapportés à ses échanges totaux du produit
    (importations à l'import, exportations à l'export). Alerte au-delà de 0,5. Plus la valeur est élevée,
    plus la ligne est vulnérable.
  python_date_format: null
  extra: null
- column_name: WORLD_HHI
  verbose_name: Concentration mondiale (WORLD_HHI)
  is_dttm: false
  is_active: true
  type: FLOAT
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: ''
  description: 'Concentration, entre pays, du commerce mondial du produit : des exportations mondiales
    (offre) à l''import, des importations mondiales (demande) à l''export. Alerte au-delà de 0,5. Plus
    la valeur est élevée, plus la ligne est vulnérable.'
  python_date_format: null
  extra: null
- column_name: consensus_score_by_reporter_level
  verbose_name: Score de vulnérabilité (0 à 1)
  is_dttm: false

{{- /*
Secret du compte et des clés de Superset, créé par le chart si demandé : valeurs tirées
au hasard à la première installation, relues sur le cluster ensuite (lookup), pour ne
jamais changer de mot de passe ni de clé à une mise à jour ; conservé à la
désinstallation (la base de métadonnées en dépend).
*/ -}}
{{- if .Values.credentials.create }}
{{- $name := .Values.global.dashboard.credentialsSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trade-dashboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ADMIN_USERNAME: {{ index $existing "ADMIN_USERNAME" | default (b64enc "admin") }}
  ADMIN_PASSWORD: {{ index $existing "ADMIN_PASSWORD" | default (randAlphaNum 32 | b64enc) }}
  SUPERSET_SECRET_KEY: {{ index $existing "SUPERSET_SECRET_KEY" | default (randAlphaNum 64 | b64enc) }}
  DB_PASS: {{ index $existing "DB_PASS" | default (randAlphaNum 32 | b64enc) }}
{{- end }}

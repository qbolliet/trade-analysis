{{- /*
Export versionné du tableau de bord (files/dashboard/) et outils d'import, lus par le Job
d'import. Les clés aplatissent le chemin relatif (« / » → « __ », interdit dans une clé) ;
le Job reconstruit l'arborescence. Plafond d'un ConfigMap : 1 Mio ; échec explicite
au-delà de 900 000 octets.
*/ -}}
{{- if .Values.dashboardImport.enabled }}
{{- $size := 0 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-export
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trade-dashboard.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Files.Glob "files/dashboard/**" }}
  {{- $size = add $size (len $content) }}
  {{ trimPrefix "files/dashboard/" $path | replace "/" "__" }}: |
    {{- toString $content | nindent 4 }}
  {{- end }}
{{- if gt (int $size) 900000 }}
{{- fail (printf "files/dashboard : %d octets, au-delà du plafond d'un ConfigMap (construire l'archive autrement)" $size) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-tools
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trade-dashboard.labels" . | nindent 4 }}
data:
  superset_bundle.py: |
    {{- .Files.Get "files/superset_bundle.py" | nindent 4 }}
  import_dashboard.py: |
    {{- .Files.Get "files/import_dashboard.py" | nindent 4 }}
{{- end }}

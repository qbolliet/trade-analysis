{{- /*
Secrets créés par le chart (désactivé par défaut) : valeurs fournies à l'installation,
jamais par un fichier versionné. Conservés à la désinstallation, pour ne pas priver de
leurs identifiants les autres consommateurs (Superset, sessions interactives).
*/ -}}
{{- if .Values.secrets.create }}
{{- range $name, $data := .Values.secrets.data }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "trade-pipeline.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}

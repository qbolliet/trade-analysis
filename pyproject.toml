[project]
name = "macroforecast"
version = "0.1.0"
description = "Macroeconomic forecasting pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "statflows[s3,ducklake]",
    "boto3>=1.43.34",
    "duckdb>=1.4",
    "jinja2>=3.1",
    "joblib>=1.4",
    # Projet Kedro (orchestration), suivi MLflow et rendu Argo des pipelines
    "kedro>=1.6,<2",
    "kedro-mlflow==2.0.3",
    # Importé par kedro-mlflow 2.0.3 (PickleDataset de ses commandes CLI) sans être
    # déclaré dans ses dépendances : sans lui, `kedro mlflow …` ne se charge pas
    "kedro-datasets>=8",
    "argo-kedro==0.1.41",
    "linearmodels>=7.0",
    "narwhals>=2.22.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "s3fs>=0.4.2",
    "scikit-learn>=1.5",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "threadpoolctl>=3.1",
    "tqdm>=4.67",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
tracking = [
    # Borne alignée sur kedro-mlflow 2.x
    "mlflow>=3,<4",
    # Métriques système (CPU, mémoire, disque, réseau) de l'onglet « System metrics »
    "psutil>=5.9",
]
# Rapport HTML de run (figures Plotly, macroforecast.tracking.figures) : import
# paresseux, sans plotly le rapport garde ses tables mais perd ses figures.
reports = [
    "plotly>=5.24",
]
# Score de Kantorovitch orienté (macroforecast.trade.aggregation.optimal_transport) :
# dépendance lourde, non requise pour le reste du package (import paresseux,
# ImportError explicite en son absence).
optimal-transport = [
    "jax>=0.4.30",
    "ott-jax>=0.4.6",
]
# Visualisation interactive du pipeline (hors image de production)
viz = [
    "kedro-viz==12.4.0",
]
# Site de documentation statique (mkdocs-material + page kedro-viz)
docs = [
    "mkdocs-material>=9.5",
    "kedro-viz==12.4.0",
]

[project.scripts]
comtrade-script = "scripts.download_comtrade:main"
eurostat-script = "scripts.download_eurostat_comext:main"
baci-hs-script = "scripts.process_baci_hs:main"
vulnerabilities-eurostat-script = "scripts.compute_trade_vulnerabilities:main"
vulnerabilities-network-script = "scripts.compute_network_vulnerabilities:main"
vulnerabilities-synthesis-script = "scripts.compute_synthetic_scores:main"
vulnerabilities-coherence-script = "scripts.compute_synthesis_coherence:main"
# Invalidation des empreintes de fraîcheur après correction d'une implémentation
invalidate-freshness-script = "scripts.invalidate_freshness:main"
# Couche de service : catalogue DuckLake `serving` lu par Superset (K-03b, PS-29)
serving-script = "scripts.publish_serving:main"
# Données fictives (démonstration) : remplace Comtrade / complète Comext
synthetic-comtrade-script = "scripts.seed_synthetic_comtrade:main"
complete-synthetic-comext-script = "scripts.complete_synthetic_comext:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Paquets construits : la méthodologie, le projet Kedro et les scripts transitoires,
# cibles des entry points ci-dessus (« scripts » retiré à leur suppression)
packages = ["macroforecast", "kedro_pipeline", "scripts"]

[tool.kedro]
# Projet Kedro à la racine du dépôt : paquet `kedro_pipeline` à côté de `macroforecast`
# (source_dir = "." évite un layout src/ qui casserait imports et entry points)
package_name = "kedro_pipeline"
project_name = "trade-analysis"
kedro_init_version = "1.6.0"
source_dir = "."

[dependency-groups]
dev = [
    "duckdb-engine>=0.17.0",
    "ipykernel>=7.1.0",
    "moto[s3]>=5.2.3",
    "pytest>=9.1.1",
    "xlwt>=1.3.0",
]

[tool.uv]
# dt-ducklake-manager est une dépendance transitive (extra `ducklake` de statflows) :
# `statflows` y fixe sa propre version, l'override permet de la surcharger ici.
override-dependencies = ["dt-ducklake-manager"]

[tool.uv.sources]
statflows = { git = "https://github.com/qbolliet/statflows", branch = "main" }
dt-ducklake-manager = { git = "https://github.com/qbolliet/dt-ducklake-manager", tag = "v0.3.1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end test on a temporary DuckLake catalog (excluded by default with `-m \"not slow\"`)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

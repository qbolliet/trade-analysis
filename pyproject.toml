[project]
name = "macroforecast"
version = "0.1.0"
description = "Macroeconomic forecasting pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.34",
    "comtradeapicall>=1.3.2",
    "dt-ducklake-manager",
    "linearmodels>=7.0",
    "narwhals>=2.22.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "psycopg2>=2.9.12",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "s3fs>=0.4.2",
    "statsmodels>=0.14.6",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
tracking = [
    "mlflow>=2.16",
]

[project.scripts]
comtrade-script = "scripts.download_comtrade:main"
eurostat-script = "scripts.download_eurostat_comext:main"
baci-script = "scripts.process_baci:main"
baci-hs-script = "scripts.process_baci_hs:main"
vulnerabilities-eurostat-script = "scripts.compute_trade_vulnerabilities:main"
test-baci-script = "scripts.test_baci:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.uv.sources]
dt-ducklake-manager = { git = "https://github.com/qbolliet/dt-ducklake-manager", branch = "main" }

# Fichier généré par `kedro trade render-argo --env toy` : ne pas modifier à la main.
# Source : pipelines Kedro (tags des nœuds) et config/base/argo.yml (bloc `workflow`).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: toy-pipeline
  namespace: toy-namespace
  labels:
    app: "toy"
    generated-by: kedro_pipeline.deploy.render
  annotations:
    trade-analysis/kedro-env: "toy"
spec:
  # Point d'entrée par défaut ; chaque CronWorkflow impose le sien
  entrypoint: daily
  serviceAccountName: toy-sa
  # Maintenance DuckLake en fin d'exécution, quelle qu'en soit l'issue
  onExit: exit-handler
  # Borne la plus large des points d'entrée ; chaque CronWorkflow impose la sienne
  activeDeadlineSeconds: 7200
  ttlStrategy: {secondsAfterSuccess: 259200, secondsAfterFailure: 604800}
  podGC: {strategy: OnPodSuccess}
  parallelism: 3
  arguments:
    parameters:
      # Étiquette de l'image ghcr (sha-<SHA court> immuable de préférence)
      - name: image-tag
        value: "sha-0000000"
      # Forçage ponctuel (vide = aucun) : plusieurs valeurs séparées par « ; », jamais par
      # « , » (Kedro découpe --params sur les virgules), ex. "partners;synthesis"
      - name: force-steps
        value: ""
      - name: force-metrics
        value: ""
      - name: force-methods
        value: ""
      # Paires clé=valeur supplémentaires transmises à --params, séparées par « , »,
      # ex. "runtime.FORCE_SCOPE.VINTAGES=HS2017,runtime.FORCE_SCOPE.PERIODS=2020;2021"
      - name: extra-params
        value: ""
  templates:
    # Point d'entrée daily : nœuds tagués cadence.daily (2 tâches)
    - name: daily
      dag:
        tasks:
          - name: download-toy
            template: kedro
            arguments: {parameters: [ {name: kedro-node, value: "download_toy"}, {name: experiment, value: "toy-01-downloads"}, {name: cpu, value: "1"}, {name: mem, value: "2"}, {name: retries, value: "0"} ]}
          - name: publish-toy
            depends: "(download-toy.Succeeded || download-toy.Failed)"
            template: locked-toy-serving
            arguments: {parameters: [ {name: kedro-node, value: "publish_toy"}, {name: experiment, value: "toy-03-serving"}, {name: cpu, value: "1"}, {name: mem, value: "2"}, {name: retries, value: "1"} ]}
    # Point d'entrée weekly : nœuds tagués cadence.weekly (2 tâches)
    - name: weekly
      dag:
        tasks:
          - name: compute-toy
            template: kedro
            arguments: {parameters: [ {name: kedro-node, value: "compute_toy"}, {name: experiment, value: "toy-02-compute"}, {name: cpu, value: "4"}, {name: mem, value: "32"}, {name: retries, value: "1"} ]}
          - name: publish-toy
            depends: "compute-toy.Succeeded"
            template: locked-toy-serving
            arguments: {parameters: [ {name: kedro-node, value: "publish_toy"}, {name: experiment, value: "toy-03-serving"}, {name: cpu, value: "1"}, {name: mem, value: "2"}, {name: retries, value: "1"} ]}
    # Tâche sérialisée par le mutex toy-serving, y compris entre exécutions concurrentes
    - name: locked-toy-serving
      inputs:
        parameters: [{name: kedro-node}, {name: experiment}, {name: cpu}, {name: mem}, {name: retries}]
      synchronization: {mutex: {name: toy-serving}}
      steps:
        - - name: run
            template: kedro
            arguments:
              parameters:
                - {name: kedro-node, value: "{{inputs.parameters.kedro-node}}"}
                - {name: experiment, value: "{{inputs.parameters.experiment}}"}
                - {name: cpu, value: "{{inputs.parameters.cpu}}"}
                - {name: mem, value: "{{inputs.parameters.mem}}"}
                - {name: retries, value: "{{inputs.parameters.retries}}"}
    # Gestionnaire de fin : cleanup_toy, sérialisé par le mutex toy-maintenance
    - name: exit-handler
      synchronization: {mutex: {name: toy-maintenance}}
      steps:
        - - name: cleanup-toy
            template: kedro
            arguments: {parameters: [ {name: kedro-node, value: "cleanup_toy"}, {name: experiment, value: "toy-00-maintenance"}, {name: cpu, value: "1"}, {name: mem, value: "2"}, {name: retries, value: "1"} ]}
    # Template conteneur générique : un nœud Kedro du pipeline __default__ par pod
    - name: kedro
      inputs:
        parameters:
          - name: kedro-node
          - name: experiment
          - name: cpu
          - name: mem
          - name: retries
      # Reprises sur erreur d'infrastructure uniquement (pod évincé, nœud perdu)
      retryStrategy: {limit: "{{inputs.parameters.retries}}", retryPolicy: OnError}
      # Requêtes = limites : un dépassement mémoire est prévisible et isolé à la tâche
      podSpecPatch: |
        containers:
          - name: main
            resources:
              requests: {cpu: "{{inputs.parameters.cpu}}", memory: "{{inputs.parameters.mem}}Gi"}
              limits:   {cpu: "{{inputs.parameters.cpu}}", memory: "{{inputs.parameters.mem}}Gi"}
      container:
        image: "registry.example/toy:{{workflow.parameters.image-tag}}"
        imagePullPolicy: IfNotPresent
        # Commande `run` du projet : `kedro run` est celle d'argo-kedro, qui ignore --params
        command: [python, -m, kedro_pipeline]
        args:
          - --pipeline=__default__
          - --env=toy
          - --nodes={{inputs.parameters.kedro-node}}
          - --params=runtime.FORCE_STEPS={{workflow.parameters.force-steps}},runtime.FORCE_METRICS={{workflow.parameters.force-metrics}},runtime.FORCE_METHODS={{workflow.parameters.force-methods}},{{workflow.parameters.extra-params}}
        env:
          # Environnement Kedro figé : les tâches BACI du DAG suivent ses millésimes cibles
          - {name: KEDRO_ENV, value: "toy"}
          - {name: IMAGE_TAG, value: "{{workflow.parameters.image-tag}}"}
          - {name: MLFLOW_EXPERIMENT_NAME, value: "{{inputs.parameters.experiment}}"}
          - {name: WORKFLOW_ID, valueFrom: {fieldRef: {fieldPath: "metadata.labels['workflows.argoproj.io/workflow']"}}}
          # Parallélisme intra-pod : CPU du pod (os.cpu_count() verrait ceux du nœud)
          - {name: NUM_CPU, value: "{{inputs.parameters.cpu}}"}
          # Métriques système des runs MLflow (onglet « System metrics »)
          - {name: MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING, value: "false"}
          - {name: MLFLOW_SYSTEM_METRICS_SAMPLING_INTERVAL, value: "10"}
          - {name: PLAIN, value: "value"}
          - {name: EMPTY, value: ""}
          - {name: TOKEN, valueFrom: {secretKeyRef: {name: toy-secret, key: TOKEN}}}
        envFrom:
          - secretRef: {name: toy-env}

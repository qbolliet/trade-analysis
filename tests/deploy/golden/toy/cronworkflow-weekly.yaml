# Fichier généré par `kedro trade render-argo --env toy` : ne pas modifier à la main.
# Source : pipelines Kedro (tags des nœuds) et config/base/argo.yml (bloc `workflow`).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: toy-pipeline-weekly
  namespace: toy-namespace
  labels:
    app: "toy"
    generated-by: kedro_pipeline.deploy.render
  annotations:
    trade-analysis/kedro-env: "toy"
spec:
  schedules: [ "0 2 * * 1" ]
  timezone: Europe/Paris
  # Une exécution à la fois par point d'entrée ; les deux cadences peuvent se recouvrir
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  workflowMetadata:
    labels:
      trade-analysis/entry-point: weekly
  workflowSpec:
    workflowTemplateRef: {name: toy-pipeline}
    # Surcharge du point d'entrée et de la durée maximale du template
    entrypoint: weekly
    activeDeadlineSeconds: 7200

# Fichier généré par `kedro trade render-argo --env toy` : ne pas modifier à la main.
# Source : pipelines Kedro (tags des nœuds) et config/base/argo.yml (bloc `workflow`).
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: toy-pipeline-daily
  namespace: toy-namespace
  labels:
    app: "toy"
    generated-by: kedro_pipeline.deploy.render
  annotations:
    trade-analysis/kedro-env: "toy"
spec:
  schedules: [ "15 1 * * *" ]
  timezone: Europe/Paris
  # Une exécution à la fois par point d'entrée ; l'exclusion entre cadences est le mutex
  # d'exécution du WorkflowTemplate
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowMetadata:
    labels:
      trade-analysis/entry-point: daily
  workflowSpec:
    workflowTemplateRef: {name: toy-pipeline}
    # Surcharge du point d'entrée et de la durée maximale du template
    entrypoint: daily
    activeDeadlineSeconds: 3600

# ─────────────────────────────────────────────────────────────────────────────
# ENVIRONNEMENT DEMO — PÉRIMÈTRE PROVISOIRE : la maintenance doit viser les catalogues
# réellement écrits par l'environnement : sources brutes et résultats sont isolés
# (demo_eurostat, demo_comtrade, demo_vulnerabilities, chemins S3 sous trade/demo/).
# `serving` est partagé avec la production (seul le schéma demo_dashboard est propre à la demo).
# La liste est remplacée en entier : la fusion de configuration ne combine pas les listes.
# ─────────────────────────────────────────────────────────────────────────────
maintenance:
  CATALOGS:
    - {dbname: demo_eurostat,   catalog_alias: eurostat,        bucket: qbollietdgddi, data_path: trade/demo/datasets/comext}
    - {dbname: demo_comtrade,   catalog_alias: comtrade,        bucket: qbollietdgddi, data_path: trade/demo/datasets/comtrade}
    - {dbname: demo_vulnerabilities, catalog_alias: vulnerabilities, bucket: qbollietdgddi, data_path: trade/demo/datasets/vulnerabilities/}
    - {dbname: serving,         catalog_alias: serving,         bucket: qbollietdgddi, data_path: trade/datasets/serving/}

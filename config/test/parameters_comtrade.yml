comtrade:
  parameters:
    C_A_HS:
      products_step: 2
  split_filters:
    C_A_HS:
      periods:
        start: 2018
        end: 2022
      products:
        include: ["280519", "300490", "810510", "854110"]
        include_regex: null
        exclude: null
  DOWNLOADS:
    C_A_HS:
      BUCKET: null
      PATHS:
        STRUCTURES_PATH: "${trade.test_root:}/datasets/structures/comtrade.json"
        LAST_DOWNLOAD_PATH: "${trade.test_root:}/datasets/last_downloads/comtrade.json"

# ENVIRONNEMENT TEST — exécution locale complète sur données simulées, sans réseau ni
# secret. Tout est écrit sous le dossier temporaire désigné par TRADE_TEST_ROOT
# (résolveur trade.test_root).

# Catalogues DuckLake FICHIERS (métadonnées SQLite, données Parquet) sous la racine de
# test : la présence de file_root remplace PostgreSQL + S3 pour toutes les poignées
ducklake:
  file_root: ${trade.test_root:ducklake}

# Aucun stockage objet ni clé d'API
s3:
  endpoint: ""
  access_key_id: ""
  secret_access_key: ""
  session_token: null

s3fs: {}

comtrade_api:
  subscription_key: ""

# ─────────────────────────────────────────────────────────────────────────────
# PROFIL DEMO (PD-19, PS-04.4) — copie COMPLÈTE de config/datasets/comtrade.yaml.
# Périmètre PROVISOIRE (PQ-07) : produits dont le code commence par 2805, 2846,
# 8105, 8112, 2844, 3004, 8541, 8542, 8507 (≈ 100 codes SH6), Comtrade ≥ 2015,
# BACI HS2017 seul. Le demo ne diffère de la production QUE par le périmètre et
# par l'isolement de ses sorties (catalogues/schémas préfixés demo_, chemins
# trade/demo/…, expériences MLflow demo-) : même ordre de téléchargement,
# max_queries null. Sélection via la variable d'environnement COMTRADE_CONFIG_PATH.
# ─────────────────────────────────────────────────────────────────────────────
# Configuration des dimensions scindées UN Comtrade
# Filtres de codes appliqués aux codelists des dimensions itérées pour
# construire la liste des requêtes (année × lot de produits, PD-07).
#
# Remarque : les codes reporters/partenaires sont les codes M49 numériques
# renvoyés par l'API Comtrade (colonne `reporterCode`), pas les codes ISO.
# Les codes produits sont les nomenclatures HS (colonne `id`).

# Dataflow téléchargé (C-05) : identifiant logique typeCode_freqCode_clCode
DATAFLOW: "C_A_HS"

# Groupes de codes réutilisables
code_groups:
  # Exemple de sélection de reporters par code M49 (à compléter selon le besoin).
  # France=251, Allemagne=276, Italie=380, Espagne=724, Pays-Bas=528.
  majors_m49: &majors_m49
    - "251"
    - "276"
    - "380"
    - "724"
    - "528"

# Paramètres
parameters:
  # Données annuelles
  C_A_HS: &params_c_a_hs
    # Nombre de codes produits par requête
    products_step: 10
    # Plafond du nombre de requêtes (null = pas de plafond). null en production
    # ET en demo : le périmètre demo est borné par ses filtres de codes (PD-07)
    max_queries: null
    # Ordre de la liste de requêtes (PS-12.1) : boucle externe sur les années
    # ("desc" = récentes d'abord, "asc" = anciennes d'abord), boucle interne sur
    # les lots de produits dans l'ordre naturel des codes. Une année est ainsi
    # complète avant que la suivante ne commence (porte de complétude BACI).
    periods_order: "desc"

  # Données mensuelles (mêmes paramètres)
  C_M_HS: *params_c_a_hs

# Paramètres fixes par dataflow, partagés par toutes les requêtes (fréquence,
# flux, type de commerce, nomenclature). Les périodes sont une dimension de
# découpage (split_filters.<dataflow>.periods), jamais un champ fixe (C-26).
fixed_dims:
  # Données annuelles, commodities, nomenclature HS
  C_A_HS: &fixed_dims_c_a_hs
    frequency: annual
    flows:
      - "M"
      - "X"
    type_code: "C"
    classification: "HS"

  # Données mensuelles, commodities, nomenclature HS
  C_M_HS:
    <<: *fixed_dims_c_a_hs
    frequency: monthly

# Filtres de codes par dataflow et par dimension scindée
split_filters:
  # Données annuelles, commodities, nomenclature HS
  C_A_HS: &c_hs
    # Bornes des périodes (années incluses). start null → première année de
    # l'analyse runtime.ANALYSIS_START_YEAR.comtrade (config/runtime.yaml, PD-08) ;
    # end null → dernière année complète (l'année en cours est exclue)
    periods:
      start: 2015              # demo : années récentes seulement (PS-04.4)
      end: null
    reporters:
      include: null            # tous filtres nuls → reporters=None (tous) en une requête
      include_regex: null
      exclude: null
      exclude_regex: null
    products:
      include: null            # partir de tous les codes disponibles
      include_regex: '^(2805|2846|8105|8112|2844|3004|8541|8542|8507)\d{2}$' # demo : HS6 des produits retenus (PQ-07)
      exclude:                 # agrégats confidentiels / totaux
        - "00"
        - "0090"
        - "009000"
        - "999999"
      exclude_regex: null

  # Données mensuelles, commodities, nomenclature HS (mêmes filtres)
  C_M_HS: *c_hs

# Configuration des téléchargements
DOWNLOADS:
  DBNAME: "demo_comtrade"   # catalogue brut isolé (le schéma est imposé par le dataflow)
  CATALOG_ALIAS: "comtrade"
  # Données annuelles, commodities, nomenclature HS
  C_A_HS:
    BUCKET: "qbollietdgddi"
    PATHS:
      DATA_PATH: "trade/demo/datasets/comtrade"
      STRUCTURES_PATH: "trade/demo/datasets/structures/comtrade.json"
      LAST_DOWNLOAD_PATH: "trade/demo/datasets/last_downloads/comtrade.json"
    N_LAST_OBSERVATIONS: 10
    # Durée maximale d'un run (arrêt propre, ARCH §2.3)
    MAX_RUNTIME:
      WEEKS: 0
      DAYS: 0
      HOURS: 10
      MINUTES: 0
      SECONDS: 0
    # Part maximale de requêtes en échec tolérée : au-delà, le script sort en erreur et l'étape
    # du workflow échoue (0 = aucune tolérance, 1 = jamais d'échec, null = pas de contrôle).
    # Les requêtes en échec ne sont pas marquées comme téléchargées : elles sont retentées au run suivant
    MAX_ERROR_RATIO: 0.5
    categorical_threshold: null

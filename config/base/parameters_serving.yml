# Couche de service : catalogue DuckLake `serving` lu directement par Superset.
#
# Lu par l'étape de publication (serving-script, puis nœud publish_serving). Les tables
# de service sont DÉRIVÉES
# des tables de résultats par les requêtes SQL DuckDB ci-dessous, puis matérialisées dans
# le catalogue `serving` en UNE transaction (Superset voit l'état précédent jusqu'au
# COMMIT). Elles sont larges, libellées et prêtes à l'affichage : un utilisateur de
# Superset n'écrit ni jointure ni requête.
#
# Gabarits SQL : syntaxe string.Template, forme $nom UNIQUEMENT (la forme accolée est
# une interpolation du chargeur de configuration, qui la résoudrait ou échouerait) ;
# une variable inconnue est une erreur. Variables disponibles :
#   - tables sources (noms qualifiés, lus depuis les configurations des étapes amont,
#     schémas demo_* compris en profil demo) : $comext, $indicators, $network,
#     $synthesis, $diagnostics, $ref_eurostat_products, $ref_eurostat_reporters,
#     $ref_eurostat_partners, $ref_comtrade_products, $ref_comtrade_reporters,
#     $hs_concordance, $hs_vintages ;
#   - fragments générés depuis les paramètres ci-dessous : $cell_filter, $comext_filter,
#     $synthesis_pivot (METHODS × LEVELS, et méthode principale), $rank_uncertainty
#     (dispersion des rangs entre UNCERTAINTY_METHODS, par niveau de LEVELS), $flow_label
#     (FLOW_LABELS), $product_level_label (PRODUCT_LEVEL_LABELS), $norm_columns, $individual_partner, $top_partners, $world_code,
#     $extra_eu_code, $total_partners (liste SQL de PARTNERS.TOTAL), $total_priority
#     (rang de préférence de la colonne partner dans PARTNERS.TOTAL) ;
#   - macros SQL de session, générées depuis runtime.NOMENCLATURES.HS :
#     vintage_in_force(année), classification_of(code, année), product_code(code)
#     (restitue le zéro initial des codes stockés en entier), hs_vintage_of(classification, année).
#
# Colonnes de nomenclature : $indicators porte classification, hs_vintage et in_force,
# $synthesis et $diagnostics portent hs_vintage (clé de contexte). Une table source
# écrite avant ces colonnes est lue à travers une vue qui les dérive (lignes en
# vigueur : classification_of, vintage_in_force, in_force = true), avec un WARNING.
serving:
  # Identité du catalogue DuckLake `serving` : base de métadonnées PostgreSQL dédiée (même
  # instance et mêmes identifiants trade-postgres-credentials que les autres catalogues,
  # créée si absente), fichiers Parquet sous BUCKET/DATA_PATH. Un catalogue n'a qu'un
  # DATA_PATH : identique en profil demo, seul SCHEMA change.
  DBNAME: "serving"
  CATALOG_ALIAS: "serving"
  BUCKET: "qbollietdgddi"
  DATA_PATH: "trade/datasets/serving/"
  # Schéma des tables de service (demo : demo_dashboard)
  SCHEMA: "dashboard"

  # Mode de publication : full (recréation de chaque table) | by_year (DELETE + INSERT des
  # seules années YEARS dans les tables PARTITIONED, retour automatique en full si les
  # colonnes produites diffèrent de celles de la table). Tant que la fraîcheur des tables
  # de service n'est pas suivie par registre : full.
  MODE: "full"
  # Années republiées en mode by_year ; null → runtime.FORCE_SCOPE.PERIODS, sinon repli
  # en full
  YEARS: null

  # Méthodes de synthèse exposées en colonnes (<méthode>_score_<niveau>,
  # <méthode>_rank_<niveau>) : noms de la colonne `method` de la table synthesis
  # (les règles de consensus y sont préfixées « consensus_ »)
  METHODS: ["consensus_borda", "auto_sum", "critic_sum"]
  # Niveaux de comparaison exposés (colonnes score_/rank_<niveau> de synthesis).
  # by_reporter_level est dérivé par la requête cell_scores : rangs par pays restreints aux
  # produits d'un même niveau de nomenclature (SH2, SH4, SH6, NC8), ordre de chaque méthode
  # conservé et rangs renumérotés (ex aequo : rang moyen) ; score identique à by_reporter.
  # La synthèse sépare les niveaux par sa colonne de contexte product_level : sur une
  # synthèse calculée ainsi, by_reporter_level est identique à by_reporter. Sur une
  # synthèse antérieure, qui classait tous les niveaux d'un pays ensemble, c'est une
  # restriction du classement commun (normalisations et pondérations estimées sur tous
  # les niveaux).
  LEVELS: ["by_reporter", "by_product", "by_reporter_level"]
  # Indicateur synthétique principal (tri par défaut du tableau de bord) : dupliqué dans
  # primary_score_<niveau>, primary_rank_<niveau>, primary_n_<niveau>
  PRIMARY_METHOD: "consensus_borda"
  # Nombre de partenaires individuels conservés par cellule dans flows (plus WORLD, EXT_EU)
  TOP_PARTNERS: 12

  # Incertitude du rang consensus : dispersion, pour une même cellule et un même niveau,
  # des rangs attribués par les méthodes ci-dessous (rang_min/max/q25/q75, rank_spread =
  # q75 - q25, n_methods). Ce n'est pas une incertitude d'échantillonnage : elle mesure le
  # désaccord entre méthodes de synthèse. Méthodes retenues : celles dont le rang est un
  # classement strict comparable à celui du consensus. Exclues : les règles de consensus
  # elles-mêmes (consensus_*), les méthodes à ex aequo massifs (pareto : couches de
  # dominance, cone_quantile et smaa : probabilités discrètes ; plus grand bloc d'ex aequo
  # de 11 à 85 % du groupe sur les données de démonstration, contre 2 à 12 % ailleurs),
  # dont les rangs moyens écraseraient les quantiles, et les méthodes sans rang aux
  # niveaux exposés (pareto_global, kantorovich : niveau global seulement). Les méthodes
  # pondérées ne sont pas ajustées par produit (groupes d'environ 22 pays, sous le plancher
  # min_group_size) : au niveau by_product, la dispersion repose sur bod, mpi et rank_mean,
  # d'où n_methods_<niveau>. null : toutes les méthodes non-consensus de la table.
  UNCERTAINTY_METHODS:
    - "auto_sum"
    - "auto_geo"
    - "critic_sum"
    - "entropy_sum"
    - "topsis_critic"
    - "vikor_critic"
    - "whitened"
    - "mpi"
    - "rank_mean"
    - "bod"

  # Libellés des codes de flux (colonne flow_label de cell_scores, filtre du tableau de bord)
  FLOW_LABELS:
    "1": "Import"
    "2": "Export"

  # Libellés des niveaux de nomenclature, par nombre de chiffres du code (colonne
  # product_level_label de cell_scores, filtre « Niveau de nomenclature » du tableau de bord) ;
  # un niveau non listé est libellé par son nombre de chiffres
  PRODUCT_LEVEL_LABELS:
    2: "SH2"
    4: "SH4"
    6: "SH6"
    8: "NC8"

  # Grille de cell_scores : prédicat sur la table indicators (alias p), mêmes modalités
  # que les contextes de la synthèse (synthesis.SYNTHESIS.FILTERS), les deux flux gardés
  CELL_FILTER: 'CAST(p."indicators" AS VARCHAR) = ''VALUE_IN_EUROS'' AND CAST(p."freq" AS VARCHAR) = ''A'''
  # Flux Comext retenus pour flows et les échanges totaux de cell_scores (alias c) : valeur
  # et quantité, pivotées en colonnes par les requêtes
  COMEXT_FILTER: 'CAST(c."indicators" AS VARCHAR) IN (''VALUE_IN_EUROS'', ''QUANTITY_IN_100KG'') AND CAST(c."freq" AS VARCHAR) = ''A'''
  # Métriques normalisées min-max (<métrique>_norm, dans [0, 1]) pour la heatmap, et
  # colonnes définissant le contexte de normalisation
  NORM_METRICS: ["HHI", "CDI2", "CDI3", "WORLD_HHI", "CENTRALITY_RISK", "CLUSTERING_W", "SPOF"]
  # hs_vintage sépare les lignes en vigueur des lignes historiques d'une même année
  NORM_PARTITION: ["hs_vintage", "flow", "year"]

  # Codes partenaires agrégés de Comext, alignés sur VulnerabilityConfig (world_code,
  # extra_eu_code, aggregate_codes, exclude_underscore_partners)
  PARTNERS:
    WORLD: "WORLD"
    EXTRA_EU: "EXT_EU"
    AGGREGATE_CODES: ["WORLD", "QW"]
    EXCLUDE_UNDERSCORE: true
    # Agrégats « échanges totaux avec le monde », par ordre de préférence : WORLD, puis
    # EXT_EU27_2020 pour l'Union (EU27_2020), dont Comext ne publie que les flux extra-UE.
    # Dénominateur de share (flows) et échanges totaux de cell_scores ; conservés dans flows.
    TOTAL: ["WORLD", "EXT_EU27_2020"]

  # Sources facultatives : si la table n'existe pas encore (référentiels non publiés,
  # étape amont jamais exécutée), la variable est remplacée par une table VIDE typée et la
  # publication continue (libellés ou scores NULL, avertissement, métrique
  # serving/missing_sources). Valeur « reference » : colonnes du référentiel ;
  # sinon, colonnes lues par les requêtes et leur type DuckDB. Toute autre source est
  # obligatoire (son absence fait échouer la publication, sans rien modifier).
  OPTIONAL_SOURCES:
    ref_eurostat_products: "reference"
    ref_eurostat_reporters: "reference"
    ref_eurostat_partners: "reference"
    ref_comtrade_products: "reference"
    ref_comtrade_reporters: "reference"
    hs_concordance: "reference"
    hs_vintages: "reference"
    network:
      classification: "VARCHAR"
      product: "VARCHAR"
      year: "INTEGER"
      # Code de flux entier, comme dans indicators (1 import, 2 export)
      flow: "BIGINT"
      WORLD_HHI: "DOUBLE"
      CENTRALITY_RISK: "DOUBLE"
      CLUSTERING_W: "DOUBLE"
      SPOF: "DOUBLE"
      WORLD_HHI_ALERT: "BOOLEAN"
      CENTRALITY_RISK_ALERT: "BOOLEAN"
      CLUSTERING_W_ALERT: "BOOLEAN"
      SPOF_ALERT: "BOOLEAN"
    synthesis:
      hs_vintage: "VARCHAR"
      freq: "VARCHAR"
      flow: "VARCHAR"
      indicators: "VARCHAR"
      TIME_PERIOD: "VARCHAR"
      product_level: "BIGINT"
      reporter: "VARCHAR"
      product: "VARCHAR"
      method: "VARCHAR"
      score_by_product: "DOUBLE"
      score_by_reporter: "DOUBLE"
      score_global: "DOUBLE"
      rank_by_product: "DOUBLE"
      rank_by_reporter: "DOUBLE"
      rank_global: "DOUBLE"
      n_by_product: "INTEGER"
      n_by_reporter: "INTEGER"
      n_global: "INTEGER"
    diagnostics:
      hs_vintage: "VARCHAR"
      freq: "VARCHAR"
      flow: "VARCHAR"
      indicators: "VARCHAR"
      TIME_PERIOD: "VARCHAR"
      product_level: "BIGINT"
      level: "VARCHAR"
      reporter: "VARCHAR"
      product: "VARCHAR"
      family: "VARCHAR"
      statistic: "VARCHAR"
      item_a: "VARCHAR"
      item_b: "VARCHAR"
      value: "DOUBLE"
      n: "INTEGER"

  # Métriques de qualité évaluées après la publication (requête scalaire, métrique
  # serving/<nom>, contrôles de parameters_tracking.yml) ; $serving = schéma de service
  # qualifié. Une requête sans résultat n'émet pas de métrique : les parts valent 1 quand
  # il n'y a rien à couvrir, pour que les contrôles portent toujours sur une métrique émise.
  METRICS:
    # Part des cellules classées dont l'incertitude repose sur au moins deux méthodes
    cell_scores/uncertainty_coverage_by_reporter: >-
      SELECT coalesce(avg(CASE WHEN n_methods_by_reporter >= 2 THEN 1.0 ELSE 0.0 END), 1.0)
      FROM $serving.cell_scores WHERE primary_rank_by_reporter IS NOT NULL
    cell_scores/uncertainty_coverage_by_product: >-
      SELECT coalesce(avg(CASE WHEN n_methods_by_product >= 2 THEN 1.0 ELSE 0.0 END), 1.0)
      FROM $serving.cell_scores WHERE primary_rank_by_product IS NOT NULL
    # Part des lignes en vigueur dont les échanges totaux avec le monde sont connus
    cell_scores/trade_value_coverage: >-
      SELECT coalesce(avg(CASE WHEN trade_value_eur IS NOT NULL THEN 1.0 ELSE 0.0 END), 1.0)
      FROM $serving.cell_scores WHERE in_force

  # Suivi d'exécution MLflow : un run par publication (URI du serveur : variable
  # MLFLOW_TRACKING_URI, sinon aucun suivi ; nom d'expérience : experiments.yml).

  # Tables de service, publiées dans cet ordre. PARTITIONED : partition DuckLake par year
  # (élagage des fichiers lus par les filtres du tableau de bord) ; SORT_BY : ordre
  # d'insertion (statistiques min/max efficaces sur les filtres reporter / product).
  TABLES:
    # Une ligne par cellule (classification, reporter, product, flow, year) : métriques
    # partenaires et réseau, alertes, scores et rangs de synthèse, incertitude du rang
    # consensus (dispersion entre méthodes), échanges totaux avec le monde (valeur et
    # quantité, partenaire WORLD de Comext ; NULL sur les lignes historiques, dont les codes
    # convertis n'ont pas de flux Comext propre ; premier agrégat de PARTNERS.TOTAL, soit
    # EXT_EU27_2020 pour l'Union), libellés « code — libellé » et niveau de nomenclature
    # (SH6, NC8…) des filtres du tableau de bord, métriques normalisées. Les rangs
    # by_reporter_level classent les produits d'un pays au sein de leur niveau de
    # nomenclature.
    # Lignes en vigueur (in_force) et historiques (flux convertis vers un millésime SH
    # antérieur) ; la jointure réseau se fait sur le millésime de rattachement de chaque
    # ligne (hs_vintage), les scores sur hs_vintage aussi. Elle porte enfin sur le flux :
    # une ligne export reçoit les métriques réseau du graphe transposé (concentration de
    # la demande mondiale), une ligne import celles de l'offre.
    cell_scores:
      PARTITIONED: true
      SORT_BY: ["year", "reporter", "product"]
      SQL: |
        WITH grid AS (
          SELECT
            CAST(p."classification" AS VARCHAR) AS classification,
            CAST(p."hs_vintage" AS VARCHAR) AS hs_vintage,
            CAST(p."in_force" AS BOOLEAN) AS in_force,
            CAST(p."freq" AS VARCHAR) AS freq,
            CAST(p."flow" AS VARCHAR) AS flow,
            CAST(p."indicators" AS VARCHAR) AS indicators,
            CAST(p."TIME_PERIOD" AS VARCHAR) AS time_period,
            CAST(substr(CAST(p."TIME_PERIOD" AS VARCHAR), 1, 4) AS INTEGER) AS year,
            CAST(p."reporter" AS VARCHAR) AS reporter,
            product_code(p."product") AS product,
            CAST(p."HHI" AS DOUBLE) AS "HHI",
            CAST(p."CDI2" AS DOUBLE) AS "CDI2",
            CAST(p."CDI3" AS DOUBLE) AS "CDI3",
            CAST(p."HHI_ALERT" AS BOOLEAN) AS "HHI_ALERT",
            CAST(p."CDI2_ALERT" AS BOOLEAN) AS "CDI2_ALERT",
            CAST(p."CDI3_ALERT" AS BOOLEAN) AS "CDI3_ALERT"
          FROM $indicators AS p
          WHERE $cell_filter
        ),
        net AS (
          SELECT
            CAST(n."classification" AS VARCHAR) AS classification,
            lpad(CAST(n."product" AS VARCHAR), 6, '0') AS hs6,
            CAST(n."year" AS INTEGER) AS year,
            CAST(n."flow" AS VARCHAR) AS flow,
            CAST(n."WORLD_HHI" AS DOUBLE) AS "WORLD_HHI",
            CAST(n."CENTRALITY_RISK" AS DOUBLE) AS "CENTRALITY_RISK",
            CAST(n."CLUSTERING_W" AS DOUBLE) AS "CLUSTERING_W",
            CAST(n."SPOF" AS DOUBLE) AS "SPOF",
            CAST(n."WORLD_HHI_ALERT" AS BOOLEAN) AS "WORLD_HHI_ALERT",
            CAST(n."CENTRALITY_RISK_ALERT" AS BOOLEAN) AS "CENTRALITY_RISK_ALERT",
            CAST(n."CLUSTERING_W_ALERT" AS BOOLEAN) AS "CLUSTERING_W_ALERT",
            CAST(n."SPOF_ALERT" AS BOOLEAN) AS "SPOF_ALERT"
          FROM $network AS n
        ),
        synthesis_levels AS (
          -- Rangs par pays restreints au niveau de nomenclature du produit (longueur du
          -- code) : ordre de chaque méthode conservé, rangs renumérotés, ex aequo au rang
          -- moyen comme dans la synthèse ; NULL sans rang par pays
          SELECT
            s.*,
            s."score_by_reporter" AS "score_by_reporter_level",
            CASE WHEN s."rank_by_reporter" IS NOT NULL THEN
              rank() OVER (PARTITION BY s."hs_vintage", s."freq", s."flow", s."indicators",
                                        s."TIME_PERIOD", s."reporter", s."method",
                                        length(product_code(s."product"))
                           ORDER BY s."rank_by_reporter")
              + (count(*) OVER (PARTITION BY s."hs_vintage", s."freq", s."flow",
                                             s."indicators", s."TIME_PERIOD", s."reporter",
                                             s."method", length(product_code(s."product")),
                                             s."rank_by_reporter") - 1) / 2
            END AS "rank_by_reporter_level",
            count(s."rank_by_reporter") OVER (
              PARTITION BY s."hs_vintage", s."freq", s."flow", s."indicators",
                           s."TIME_PERIOD", s."reporter", s."method",
                           length(product_code(s."product"))
            ) AS "n_by_reporter_level"
          FROM $synthesis AS s
        ),
        scores AS (
          SELECT
            CAST(s."hs_vintage" AS VARCHAR) AS hs_vintage,
            CAST(s."freq" AS VARCHAR) AS freq,
            CAST(s."flow" AS VARCHAR) AS flow,
            CAST(s."indicators" AS VARCHAR) AS indicators,
            CAST(s."TIME_PERIOD" AS VARCHAR) AS time_period,
            CAST(s."reporter" AS VARCHAR) AS reporter,
            product_code(s."product") AS product,
            $synthesis_pivot,
            $rank_uncertainty
          FROM synthesis_levels AS s
          GROUP BY ALL
        ),
        trade_raw AS (
          SELECT
            CAST(substr(CAST(c."TIME_PERIOD" AS VARCHAR), 1, 4) AS INTEGER) AS year,
            CAST(c."reporter" AS VARCHAR) AS reporter,
            product_code(c."product") AS product,
            CAST(c."flow" AS VARCHAR) AS flow,
            CAST(c."partner" AS VARCHAR) AS partner,
            max(CASE WHEN CAST(c."indicators" AS VARCHAR) = 'VALUE_IN_EUROS'
                     THEN CAST(c."OBS_VALUE" AS DOUBLE) END) AS value_eur,
            max(CASE WHEN CAST(c."indicators" AS VARCHAR) = 'QUANTITY_IN_100KG'
                     THEN CAST(c."OBS_VALUE" AS DOUBLE) END) AS quantity_100kg
          FROM $comext AS c
          WHERE $comext_filter AND CAST(c."partner" AS VARCHAR) IN ($total_partners)
          GROUP BY ALL
        ),
        trade AS (
          -- Premier agrégat total disponible (WORLD, sinon extra-UE pour l'Union)
          SELECT year, reporter, product, flow,
                 arg_min(value_eur, $total_priority) AS value_eur,
                 arg_min(quantity_100kg, $total_priority) AS quantity_raw
          FROM trade_raw
          GROUP BY ALL
        ),
        trade_totals AS (
          -- Quantité nulle pour une valeur positive : quantité non déclarée, pas un flux nul
          SELECT year, reporter, product, flow, value_eur,
                 CASE WHEN quantity_raw = 0 AND value_eur > 0 THEN NULL
                      ELSE quantity_raw END AS quantity_100kg
          FROM trade
        ),
        product_labels AS (
          SELECT code, arg_max(label, classification) AS label
          FROM $ref_eurostat_products
          GROUP BY code
        ),
        reporter_labels AS (
          SELECT code, first(label) AS label
          FROM $ref_eurostat_reporters
          GROUP BY code
        ),
        cells AS (
          SELECT
            g.classification, g.hs_vintage, g.in_force,
            g.year, g.time_period, g.freq, g.flow, $flow_label AS flow_label, g.indicators,
            g.reporter, rl.label AS reporter_label,
            CASE WHEN rl.label IS NULL THEN g.reporter
                 ELSE g.reporter || ' — ' || rl.label END AS reporter_display,
            g.product, pl.label AS product_label, length(g.product) AS product_level,
            $product_level_label AS product_level_label,
            CASE WHEN pl.label IS NULL THEN g.product
                 ELSE g.product || ' — ' || pl.label END AS product_display,
            tr.value_eur AS trade_value_eur, tr.quantity_100kg AS trade_quantity_100kg,
            g."HHI", g."CDI2", g."CDI3",
            net."WORLD_HHI", net."CENTRALITY_RISK", net."CLUSTERING_W", net."SPOF",
            g."HHI_ALERT", g."CDI2_ALERT", g."CDI3_ALERT",
            net."WORLD_HHI_ALERT", net."CENTRALITY_RISK_ALERT", net."CLUSTERING_W_ALERT",
            net."SPOF_ALERT",
            sc.* EXCLUDE (hs_vintage, freq, flow, indicators, time_period, reporter, product)
          FROM grid AS g
          LEFT JOIN net
            ON net.classification = g.hs_vintage
           AND net.hs6 = substr(g.product, 1, 6)
           AND length(g.product) >= 6
           AND net.year = g.year
           AND net.flow = g.flow
          LEFT JOIN scores AS sc
            ON sc.hs_vintage = g.hs_vintage
           AND sc.freq = g.freq AND sc.flow = g.flow AND sc.indicators = g.indicators
           AND sc.time_period = g.time_period AND sc.reporter = g.reporter
           AND sc.product = g.product
          LEFT JOIN trade_totals AS tr
            ON g.in_force
           AND tr.year = g.year AND tr.reporter = g.reporter AND tr.product = g.product
           AND tr.flow = g.flow
          LEFT JOIN product_labels AS pl ON pl.code = g.product
          LEFT JOIN reporter_labels AS rl ON rl.code = g.reporter
        )
        SELECT *, $norm_columns
        FROM cells

    # Cohérence entre métriques (famille « metrics » de synthesis_diagnostics) : une ligne
    # par contexte (niveau de nomenclature product_level compris) × niveau × groupe ×
    # statistique × paire de métriques. reporter / product
    # NULL quand le groupe est « ALL » ; metric_a / metric_b NULL quand sans objet.
    coherence_metrics:
      SQL: |
        WITH d AS (
          SELECT *, CAST(substr(CAST("TIME_PERIOD" AS VARCHAR), 1, 4) AS INTEGER) AS _year
          FROM $diagnostics
        )
        SELECT
          CASE WHEN CAST(d."product" AS VARCHAR) = 'ALL' THEN CAST(d."hs_vintage" AS VARCHAR)
               WHEN CAST(d."hs_vintage" AS VARCHAR) = vintage_in_force(d._year)
               THEN classification_of(d."product", d._year)
               ELSE CAST(d."hs_vintage" AS VARCHAR) END AS classification,
          CAST(d."hs_vintage" AS VARCHAR) AS hs_vintage,
          d._year AS year,
          CAST(d."TIME_PERIOD" AS VARCHAR) AS time_period,
          CAST(d."freq" AS VARCHAR) AS freq,
          CAST(d."flow" AS VARCHAR) AS flow,
          CAST(d."indicators" AS VARCHAR) AS indicators,
          CAST(d."product_level" AS INTEGER) AS product_level,
          CAST(d."level" AS VARCHAR) AS level,
          NULLIF(CAST(d."reporter" AS VARCHAR), 'ALL') AS reporter,
          CASE WHEN CAST(d."product" AS VARCHAR) = 'ALL' THEN NULL
               ELSE product_code(d."product") END AS product,
          CAST(d."statistic" AS VARCHAR) AS statistic,
          NULLIF(CAST(d."item_a" AS VARCHAR), '') AS metric_a,
          NULLIF(CAST(d."item_b" AS VARCHAR), '') AS metric_b,
          CAST(d."value" AS DOUBLE) AS value,
          CAST(d."n" AS INTEGER) AS n
        FROM d
        WHERE CAST(d."family" AS VARCHAR) = 'metrics'

    # Cohérence entre méthodes (famille « methods ») : method_a / method_b sont des
    # méthodes, sauf pour lomo_* et score_metric_tau où method_b est une MÉTRIQUE (S-2.5).
    coherence_methods:
      SQL: |
        WITH d AS (
          SELECT *, CAST(substr(CAST("TIME_PERIOD" AS VARCHAR), 1, 4) AS INTEGER) AS _year
          FROM $diagnostics
        )
        SELECT
          CASE WHEN CAST(d."product" AS VARCHAR) = 'ALL' THEN CAST(d."hs_vintage" AS VARCHAR)
               WHEN CAST(d."hs_vintage" AS VARCHAR) = vintage_in_force(d._year)
               THEN classification_of(d."product", d._year)
               ELSE CAST(d."hs_vintage" AS VARCHAR) END AS classification,
          CAST(d."hs_vintage" AS VARCHAR) AS hs_vintage,
          d._year AS year,
          CAST(d."TIME_PERIOD" AS VARCHAR) AS time_period,
          CAST(d."freq" AS VARCHAR) AS freq,
          CAST(d."flow" AS VARCHAR) AS flow,
          CAST(d."indicators" AS VARCHAR) AS indicators,
          CAST(d."product_level" AS INTEGER) AS product_level,
          CAST(d."level" AS VARCHAR) AS level,
          NULLIF(CAST(d."reporter" AS VARCHAR), 'ALL') AS reporter,
          CASE WHEN CAST(d."product" AS VARCHAR) = 'ALL' THEN NULL
               ELSE product_code(d."product") END AS product,
          CAST(d."statistic" AS VARCHAR) AS statistic,
          NULLIF(CAST(d."item_a" AS VARCHAR), '') AS method_a,
          NULLIF(CAST(d."item_b" AS VARCHAR), '') AS method_b,
          CAST(d."value" AS DOUBLE) AS value,
          CAST(d."n" AS INTEGER) AS n
        FROM d
        WHERE CAST(d."family" AS VARCHAR) = 'methods'

    # Parts des partenaires par cellule (reporter, product, flow, year) : les TOP_PARTNERS
    # premiers partenaires individuels (rank 1 = premier fournisseur / client, en valeur)
    # plus les agrégats WORLD, EXT_EU et ceux de PARTNERS.TOTAL (rank NULL, is_aggregate vrai) ; valeur en euros et
    # quantité en 100 kg (NULL quand Comext publie 0 pour une valeur positive : quantité non
    # déclarée) ; share = value_eur / premier agrégat de PARTNERS.TOTAL (WORLD ; EXT_EU27_2020
    # pour l'Union).
    flows:
      PARTITIONED: true
      SORT_BY: ["year", "product", "reporter"]
      SQL: |
        WITH f_raw AS (
          SELECT
            CAST(substr(CAST(c."TIME_PERIOD" AS VARCHAR), 1, 4) AS INTEGER) AS year,
            CAST(c."reporter" AS VARCHAR) AS reporter,
            product_code(c."product") AS product,
            CAST(c."flow" AS VARCHAR) AS flow,
            CAST(c."partner" AS VARCHAR) AS partner,
            max(CASE WHEN CAST(c."indicators" AS VARCHAR) = 'VALUE_IN_EUROS'
                     THEN CAST(c."OBS_VALUE" AS DOUBLE) END) AS value_eur,
            max(CASE WHEN CAST(c."indicators" AS VARCHAR) = 'QUANTITY_IN_100KG'
                     THEN CAST(c."OBS_VALUE" AS DOUBLE) END) AS quantity_100kg
          FROM $comext AS c
          WHERE $comext_filter
          GROUP BY ALL
        ),
        f AS (
          SELECT year, reporter, product, flow, partner, value_eur,
                 CASE WHEN quantity_100kg = 0 AND value_eur > 0 THEN NULL
                      ELSE quantity_100kg END AS quantity_100kg
          FROM f_raw
          -- Ligne de quantité sans valeur : hors du périmètre en valeur des tables de service
          WHERE value_eur IS NOT NULL
        ),
        world AS (
          -- Premier agrégat total disponible (WORLD, sinon extra-UE pour l'Union)
          SELECT year, reporter, product, flow,
                 arg_min(value_eur, $total_priority) AS world_value
          FROM f
          WHERE partner IN ($total_partners)
          GROUP BY ALL
        ),
        ranked AS (
          SELECT f.*,
                 CAST(rank() OVER (PARTITION BY year, reporter, product, flow
                                   ORDER BY value_eur DESC NULLS LAST) AS INTEGER) AS rank,
                 FALSE AS is_aggregate
          FROM f
          WHERE $individual_partner
          QUALIFY rank() OVER (PARTITION BY year, reporter, product, flow
                               ORDER BY value_eur DESC NULLS LAST) <= $top_partners
        ),
        aggregates AS (
          SELECT f.*, CAST(NULL AS INTEGER) AS rank, TRUE AS is_aggregate
          FROM f
          WHERE partner IN ('$world_code', '$extra_eu_code') OR partner IN ($total_partners)
        ),
        partner_labels AS (
          SELECT code, first(label) AS label FROM $ref_eurostat_partners GROUP BY code
        ),
        reporter_labels AS (
          SELECT code, first(label) AS label FROM $ref_eurostat_reporters GROUP BY code
        ),
        product_labels AS (
          SELECT code, arg_max(label, classification) AS label
          FROM $ref_eurostat_products
          GROUP BY code
        )
        SELECT
          classification_of(r.product, r.year) AS classification,
          vintage_in_force(r.year) AS hs_vintage,
          r.year, r.reporter, rl.label AS reporter_label,
          r.product, pl.label AS product_label, length(r.product) AS product_level,
          r.flow, r.partner, ptl.label AS partner_label, r.is_aggregate,
          r.value_eur, r.quantity_100kg, r.value_eur / NULLIF(w.world_value, 0) AS share,
          r.rank
        FROM (SELECT * FROM ranked UNION ALL BY NAME SELECT * FROM aggregates) AS r
        LEFT JOIN world AS w
          ON w.year = r.year AND w.reporter = r.reporter AND w.product = r.product
         AND w.flow = r.flow
        LEFT JOIN partner_labels AS ptl ON ptl.code = r.partner
        LEFT JOIN reporter_labels AS rl ON rl.code = r.reporter
        LEFT JOIN product_labels AS pl ON pl.code = r.product

    # Libellés des produits, par source et classification (codelists non millésimées :
    # classification = celle en vigueur l'année du téléchargement)
    products:
      SQL: |
        SELECT 'eurostat' AS source, classification, code, label, level, parent_code
        FROM $ref_eurostat_products
        UNION ALL BY NAME
        SELECT 'comtrade' AS source, classification, code, label, level, parent_code
        FROM $ref_comtrade_products

    # Pays et agrégats, une ligne par (source, code), rôles déclarant / partenaire
    countries:
      SQL: |
        WITH c AS (
          SELECT *, TRUE AS is_reporter, FALSE AS is_partner FROM $ref_eurostat_reporters
          UNION ALL BY NAME
          SELECT *, FALSE AS is_reporter, TRUE AS is_partner FROM $ref_eurostat_partners
          UNION ALL BY NAME
          SELECT *, TRUE AS is_reporter, FALSE AS is_partner FROM $ref_comtrade_reporters
        )
        SELECT source, code, first(label) AS label, max(iso3) AS iso3, max(m49) AS m49,
               bool_or(is_aggregate) AS is_aggregate,
               bool_or(is_reporter) AS is_reporter, bool_or(is_partner) AS is_partner
        FROM c
        GROUP BY source, code

    # Tables de passage entre millésimes SH (cache UNSD) et millésimes en vigueur
    hs_concordance:
      SQL: SELECT * FROM $hs_concordance
    hs_vintages:
      SQL: SELECT * FROM $hs_vintages

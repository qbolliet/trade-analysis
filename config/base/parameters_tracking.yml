# Rapport de run MLflow : verdict, contrôles déclaratifs, description et rapport HTML
# publiés par chaque étape à la fin de son exécution (scripts transitoires, puis nœuds
# Kedro, qui reçoivent ce bloc en paramètre `tracking`).
tracking:
  # Métriques système du pod (onglet « System metrics »). Les variables
  # MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING / MLFLOW_SYSTEM_METRICS_SAMPLING_INTERVAL sont
  # injectées dans les pods par le rendu des manifestes Argo ; ce bloc en est la référence.
  SYSTEM_METRICS:
    ENABLED: true
    SAMPLING_SECONDS: 30
  REPORT:
    # Publier report/report.html (rapport autonome, une section par étape)
    HTML: true
    # inline : plotly.js embarqué (autonome, ~3,5 Mo) ; cdn : léger, exige internet côté navigateur
    PLOTLY_JS: inline
    # Longueur maximale de la description (tag mlflow.note.content) ; la copie intégrale est
    # dans report/summary.md. Sous la limite de longueur d'un tag du serveur.
    MAX_DESCRIPTION_CHARS: 7500
    # Lignes affichées par table dans le rapport HTML (le CSV complet reste dans tables/)
    MAX_TABLE_ROWS: 50
    # Unités en échec détaillées dans la description
    MAX_FAILURES_LISTED: 20
  # Liens insérés dans la description ({workflow_id} est remplacé). Renseigner l'URL de
  # l'interface Argo du namespace, par exemple
  # "https://<argo-ui>/workflows/user-qbollietdgddi/{workflow_id}" ; null : pas de lien.
  LINKS:
    ARGO_WORKFLOW: null
  # Contrôles par nœud (clé = nom du nœud, joker `*` accepté). Deux contrôles implicites
  # s'ajoutent à tous les nœuds, hors configuration : « aucune unité en échec » (error) et
  # « toutes les unités prévues traitées » (warning).
  #   op : < <= > >= == !=   (le contrôle est RÉUSSI quand `valeur op seuil` est vrai)
  #   severity : warning | error ; métrique absente → contrôle ignoré (« skipped »)
  # Les métriques visées sont celles RÉELLEMENT émises par les scripts (un test le vérifie).
  # Seuils initiaux à calibrer sur les premières exécutions réelles.
  CHECKS:
    "download_*":
      - {metric: download/error_share,  op: "<=", threshold: 0.05, severity: warning, label: "Part de requêtes en erreur"}
      - {metric: download/processed,    op: ">",  threshold: 0,    severity: warning, label: "Au moins une requête traitée"}
      - {metric: download/wait_share,   op: "<=", threshold: 0.5,  severity: warning, label: "Temps passé en attente du limiteur"}
    "process_baci_*":
      # La porte de complétude (années complètes) est évaluée par l'étape BACI elle-même.
      # Une section de métriques par étape : conversion, gravity, valuation (fobisation et
      # régime de valorisation), reconciliation, quality, nes, harmonization, output
      - {metric: coverage/years_eligible,                  op: ">",  threshold: 0,    severity: error,   label: "Au moins une année complète"}
      - {metric: output/flows,                             op: ">",  threshold: 0,    severity: error,   label: "Flux écrits"}
      - {metric: conversion/share_tonnage_missing,         op: "<=", threshold: 0.05, severity: warning, label: "Flux sans tonnage (1 − part convertie en tonnes)"}
      - {metric: gravity/r_squared,                        op: ">=", threshold: 0.5,  severity: warning, label: "R² de l'équation de gravité"}
      - {metric: valuation/share_clipped_to_zero,          op: "<=", threshold: 0.01, severity: warning, label: "Valeurs FOB tronquées à zéro"}
    # Métriques préfixées par sens de flux : un contrôle par sens, ignoré (« skipped ») pour
    # un sens absent de FLOWS ou non recalculé par ce run. Sous Kedro, un run par nœud : les
    # contrôles sont évalués sur chaque passe (millésime SH) et libellés « … — HS2022 »
    compute_partner_vulnerabilities:
      - {metric: partners/import/cells/n_total,            op: ">",  threshold: 0,    severity: warning, label: "Cellules de vulnérabilité calculées (import)"}
      - {metric: partners/export/cells/n_total,            op: ">",  threshold: 0,    severity: warning, label: "Cellules de vulnérabilité calculées (export)"}
    # Scripts : un run par millésime (compute_network_vulnerabilities_<millésime>) ; Kedro :
    # un run pour le nœud, contrôles évalués sur chaque millésime
    "compute_network_vulnerabilities*":
      - {metric: network/import/cells/n_total,             op: ">",  threshold: 0,    severity: warning, label: "Cellules de vulnérabilité de réseau calculées (import)"}
      - {metric: network/export/cells/n_total,             op: ">",  threshold: 0,    severity: warning, label: "Cellules de vulnérabilité de réseau calculées (export)"}
    compute_synthetic_scores:
      - {metric: synthesis/n_contexts,                     op: ">",  threshold: 0,    severity: warning, label: "Contextes calculés"}
    compute_synthesis_coherence:
      - {metric: coherence/n_contexts,                     op: ">",  threshold: 0,    severity: warning, label: "Contextes de cohérence calculés"}
    publish_serving:
      - {metric: serving/cell_scores/rows,                 op: ">",  threshold: 0,    severity: error,   label: "Table cell_scores non vide"}
      - {metric: serving/countries/rows,                   op: ">",  threshold: 0,    severity: error,   label: "Table countries non vide"}
  # Runs orphelins : à la fin de chaque exécution, la maintenance passe en FAILED les runs
  # de l'exécution (tag workflow_id) restés RUNNING dans ces expériences — tâche tuée par
  # un manque de mémoire ou une échéance avant d'avoir fermé son run. Les expériences sont
  # celles des tags `experiment.*` des nœuds (un test le vérifie).
  STALE_RUNS:
    EXPERIMENTS:
      - trade-00-maintenance
      - trade-01-downloads
      - trade-02-baci
      - trade-03-vulnerabilities
      - trade-04-serving
    # Âge minimal d'un run pour être clos : toutes les autres tâches sont terminées quand
    # la maintenance s'exécute (gestionnaire de fin de workflow), aucun délai n'est requis
    MIN_AGE_MINUTES: 0
    DESCRIPTION: "tâche interrompue — voir Argo"

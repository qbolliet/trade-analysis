# Identifiants d'exécution — versionné : ne contient QUE des références à des variables
# d'environnement (résolveur oc.env, autorisé par Kedro dans les seuls fichiers
# credentials*). Les secrets ne transitent donc jamais par les paramètres, ni par les
# paramètres journalisés dans MLflow ; les nœuds les reçoivent par les datasets.
# Une variable absente donne une valeur vide : l'erreur (« PGHOST is not set … ») n'est
# levée qu'à la première connexion, de sorte que le catalogue s'instancie sans secrets.

# Bases de métadonnées PostgreSQL des catalogues DuckLake (secret trade-postgres-credentials).
# Le catalogue de restitution `serving` est écrit avec ces mêmes identifiants : pas de
# bloc dédié
ducklake_postgres:
  host: ${oc.env:PGHOST,""}
  port: ${oc.env:PGPORT,"5432"}
  user: ${oc.env:PGUSER,""}
  password: ${oc.env:PGPASSWORD,""}
  admin_dbname: ${oc.env:PGDATABASE,"postgres"}
  admin_user: ${oc.env:PGADMINUSER,"postgres"}
  admin_password: ${oc.env:PGPASSWORD,""}

# Stockage S3 des fichiers Parquet et des registres (secret trade-s3-credentials).
# Jeton de session optionnel : les clés permanentes Minio n'en ont pas
s3:
  endpoint: ${oc.env:AWS_S3_ENDPOINT,"minio.lab.sspcloud.fr"}
  access_key_id: ${oc.env:AWS_ACCESS_KEY_ID,""}
  secret_access_key: ${oc.env:AWS_SECRET_ACCESS_KEY,""}
  session_token: ${oc.env:AWS_SESSION_TOKEN,null}

# Clé d'abonnement de l'API UN Comtrade (secret comtrade-api-credentials)
comtrade_api:
  subscription_key: ${oc.env:COMTRADE_PREMIUM_INSTITUTIONNAL_SUBSCRIPTION_KEY,""}

# Identifiants complets d'un catalogue DuckLake (métadonnées PostgreSQL + fichiers S3),
# composés par interpolation : un dataset Kedro ne reçoit qu'une entrée de credentials
ducklake:
  postgres: ${ducklake_postgres}
  s3: ${s3}

# Identifiants S3 au format fsspec (s3fs), pour les datasets Kedro génériques
# (périmètre BACI en pickle)
s3fs:
  key: ${oc.env:AWS_ACCESS_KEY_ID,""}
  secret: ${oc.env:AWS_SECRET_ACCESS_KEY,""}
  token: ${oc.env:AWS_SESSION_TOKEN,null}
  client_kwargs:
    endpoint_url: https://${oc.env:AWS_S3_ENDPOINT,"minio.lab.sspcloud.fr"}

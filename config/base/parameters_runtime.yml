# Paramètres d'exécution partagés par toutes les étapes du pipeline. Les autres
# fichiers de paramètres y renvoient par interpolation (${runtime.…}), résolue après la
# fusion des fichiers d'un même environnement.
runtime:
  # Première année de l'analyse, PAR SOURCE : Comext existe depuis 1988 ;
  # la couverture déclarative Comtrade en SH est jugée satisfaisante à partir de
  # 1994 (Gaulier & Zignago 2010)
  ANALYSIS_START_YEAR:
    eurostat: 1988
    comtrade: 1994
  # Millésimes du Système harmonisé et année d'entrée en vigueur (une table par
  # famille de résultats, clé `classification`, drapeau `in_force`). Source
  # unique pour les cibles BACI (START_YEAR nul → max(entrée en vigueur,
  # ANALYSIS_START_YEAR.comtrade)). HS1992 (H0) est en vigueur depuis 1988.
  NOMENCLATURES:
    HS:
      HS1992: 1988
      HS1996: 1996
      HS2002: 2002
      HS2007: 2007
      HS2012: 2012
      HS2017: 2017
      HS2022: 2022
  # Jour de la cadence hebdomadaire (0 = lundi … 6 = dimanche), partagé par BACI,
  # la synthèse, la cohérence et la maintenance hebdomadaire
  WEEKLY_DAY: 5
  # Parallélisme intra-pod : null → NUM_CPU (injecté par Argo) ou os.cpu_count()
  N_JOBS: null
  # Forçage ponctuel, vide par défaut. Valeurs séparées par « , » ou « ; » :
  # sous `kedro run --params`, utiliser « ; » (Kedro découpe l'argument sur les
  # virgules avant de séparer clés et valeurs). FORCE_METRICS / FORCE_METHODS seuls
  # suffisent à forcer les étapes qui calculent ces noms, sans incrément de version.
  # Surcharges par variables d'environnement (non vides) : FORCE_STEPS,
  # FORCE_METRICS, FORCE_METHODS, FORCE_REPORTERS, FORCE_PRODUCTS, FORCE_PERIODS,
  # FORCE_VINTAGES
  FORCE_STEPS: ""        # ex. "partners,synthesis" ou "all"
  FORCE_METRICS: ""      # ex. "HHI,CDI2"
  FORCE_METHODS: ""      # ex. "critic_sum"
  FORCE_SCOPE:
    REPORTERS: ""        # ex. "FR,DE"
    PRODUCTS: ""         # préfixes acceptés : "28,8541"
    PERIODS: ""          # ex. "2020,2021"
    VINTAGES: ""         # ex. "HS2017"
